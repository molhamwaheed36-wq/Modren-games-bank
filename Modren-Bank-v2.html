<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modren Bank</title>
<style>
body{margin:0;background:#0b1628;color:#fff;font-family:Arial;padding:18px}main{max-width:900px;margin:auto}.box{background:#12213a;border:1px solid #294365;border-radius:18px;padding:18px;margin:12px 0}input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #3b5678;background:#091426;color:#fff}button{background:#2864e8;font-weight:bold}.danger{background:#d33}.ok{background:#198754}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hide{display:none}.muted{color:#aebbd0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #29415f}
</style></head><body><main>
<div class="box"><h1>🏦 Modren Bank</h1><div class="muted">نظام Modren Bank لمشروع Modren Empire</div></div>
<section id="login" class="box"><h2>تسجيل الدخول</h2><div class="grid">
<div><h3>👤 عضو</h3><input id="user" placeholder="اسم المستخدم"><input id="pass" type="password" placeholder="كلمة المرور"><button onclick="memberLogin()">دخول</button></div>
<div><h3>👑 مدير</h3><input id="adminPass" type="password" placeholder="كلمة مرور المدير"><button onclick="adminLogin()">دخول المدير</button></div></div>
<p class="muted">نسخة تجريبية محلية؛ كلمات المرور ليست مناسبة للاستخدام الحقيقي قبل إضافة Backend آمن.</p></section>
<section id="app" class="hide"><div class="box"><button onclick="home()">الرئيسية</button><button onclick="logs()">📜 سجل المعاملات</button><button id="adminBtn" class="hide" onclick="admin()">⚙️ الإدارة</button><button class="danger" onclick="logout()">خروج</button></div>
<div id="page" class="box"></div></section>
<script>
const K="modren_bank_v3";let db=JSON.parse(localStorage.getItem(K)||"null")||{adminPass:"1234",curr:{ME:{name:"Modren Empire",neg:false},USD:{name:"US Dollar",neg:false},EUR:{name:"Euro",neg:false}},users:{},logs:[]},role="",me="";
function save(){localStorage.setItem(K,JSON.stringify(db))}
function log(type,from,to,amount,curr,note){db.logs.unshift({time:new Date().toLocaleString("ar"),type,from,to,amount,curr,note});save()}
function memberLogin(){let u=user.value,p=pass.value;if(!db.users[u]||db.users[u].pass!==p)return alert("بيانات الدخول غير صحيحة");role="member";me=u;enter()}
function adminLogin(){if(adminPass.value!==db.adminPass)return alert("كلمة مرور المدير غير صحيحة");role="admin";enter()}
function enter(){login.classList.add("hide");app.classList.remove("hide");adminBtn.classList.toggle("hide",role!=="admin");home()}
function logout(){location.reload()}
function home(){if(role==="admin"){page.innerHTML="<h2>👑 لوحة المدير</h2><div class='grid'><div class='box'>الأعضاء: "+Object.keys(db.users).length+"</div><div class='box'>المعاملات: "+db.logs.length+"</div></div><h3>إنشاء حساب عضو</h3><input id='newU' placeholder='اسم المستخدم'><input id='newP' type='password' placeholder='كلمة المرور'><input id='newId' placeholder='هوية العضو'><button class='ok' onclick='createUser()'>إنشاء الحساب</button><h3>إدارة الأموال</h3><select id='mu'>"+Object.keys(db.users).map(u=>"<option>"+u+"</option>").join("")+"</select><input id='amt' type='number' placeholder='المبلغ'><select id='mc'>"+Object.keys(db.curr).map(c=>"<option>"+c+"</option>").join("")+"</select><button onclick='money(1)'>➕ إضافة</button><button class='danger' onclick='money(-1)'>➖ سحب</button><h3>إنشاء عملة</h3><input id='cn' placeholder='اسم العملة'><input id='cs' placeholder='رمز العملة'><label><input id='ng' type='checkbox' style='width:auto'> السماح بالرصيد السالب</label><button onclick='currency()'>إنشاء العملة</button><h3>الحسابات</h3><div>"+Object.keys(db.users).map(u=>"<div class='box'><b>"+u+"</b> — "+db.users[u].id+"<br>"+Object.entries(db.users[u].bal).map(x=>x[0]+": "+x[1]).join(" | ")+"<br><button class='danger' onclick="del('"+encodeURIComponent(u)+"')">حذف الحساب</button></div>").join("")+"</div>"}else{let u=db.users[me];page.innerHTML="<h2>مرحباً "+me+" 👤</h2><h3>💰 أرصدتك</h3><div class='grid'>"+Object.entries(u.bal).map(x=>"<div class='box'><b>"+x[0]+"</b><br><strong>"+x[1]+"</strong></div>").join("")+"</div><h3>💳 البطاقة البنكية</h3><div class='box'>الاسم: "+u.name+"<br>الهوية: "+u.id+"<br>رقم البطاقة: "+u.card+"<br>رمز الأمان: "+u.sec+"<br>Barcode: "+u.bar+"</div><h3>💸 تحويل أموال</h3><select id='to'>"+Object.keys(db.users).filter(x=>x!==me).map(x=>"<option>"+x+"</option>").join("")+"</select><input id='sa' type='number' placeholder='المبلغ'><select id='sc'>"+Object.keys(db.curr).map(c=>"<option>"+c+"</option>").join("")+"</select><button onclick='send()'>إرسال</button>"}}
function logs(){let a=role==="admin"?db.logs:db.logs.filter(x=>x.from===me||x.to===me);page.innerHTML="<h2>📜 سجل المعاملات</h2><div style='overflow:auto'><table><tr><th>الوقت</th><th>النوع</th><th>من</th><th>إلى</th><th>المبلغ</th><th>العملة</th><th>ملاحظات</th></tr>"+a.map(x=>"<tr><td>"+x.time+"</td><td>"+x.type+"</td><td>"+x.from+"</td><td>"+x.to+"</td><td>"+x.amount+"</td><td>"+x.curr+"</td><td>"+x.note+"</td></tr>").join("")+"</table></div>"}
function createUser(){let u=newU.value,p=newP.value,id=newId.value;if(!u||!p||!id||db.users[u])return alert("أكمل البيانات أو الاسم موجود");db.users[u]={name:u,pass:p,id,card:"MB-"+Date.now().toString().slice(-10),sec:Math.floor(100000+Math.random()*900000),bar:"MB|"+id+"|"+u,bal:{ME:0,USD:0,EUR:0}};log("إنشاء حساب","المدير",u,0,"ME","إنشاء عضو");home()}
function money(s){let u=mu.value,c=mc.value,a=Number(amt.value),b=db.users[u].bal[c]||0;if(!a||a<0)return alert("مبلغ غير صحيح");if(s<0&&!db.curr[c].neg&&b<a)return alert("الرصيد غير كافٍ");db.users[u].bal[c]=b+s*a;log(s>0?"إضافة أموال":"سحب أموال","المدير",u,a,c,"عملية إدارية");save();home()}
function currency(){let n=cn.value,s=cs.value.toUpperCase();if(!n||!s||db.curr[s])return alert("بيانات غير صحيحة");db.curr[s]={name:n,neg:ng.checked};Object.values(db.users).forEach(u=>u.bal[s]=0);save();home()}
function del(e){let u=decodeURIComponent(e);if(confirm("حذف الحساب؟")){delete db.users[u];log("حذف حساب","المدير",u,0,"ME","حذف عضو");save();home()}}
function send(){let t=to.value,c=sc.value,a=Number(sa.value),u=db.users[me];if(!db.users[t]||a<=0||(u.bal[c]||0)<a)return alert("البيانات غير صحيحة أو الرصيد غير كافٍ");u.bal[c]-=a;db.users[t].bal[c]=(db.users[t].bal[c]||0)+a;log("تحويل",me,t,a,c,"تحويل عضو");save();home();alert("تم التحويل")}
function admin(){home()}
</script></main></body></html>
